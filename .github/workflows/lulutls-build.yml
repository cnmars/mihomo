name: lulutls build

# Builds mihomo + the lulutls outbound for every platform our clients ship on.
#
#   push to `lulutls`  -> artifacts only
#   tag `v*-lulutls*`  -> GitHub release with the binaries below
#
# Binaries are what OmniWave (Tauri) embeds under src-tauri/binaries/mihomo-<target>.

on:
  push:
    branches: [lulutls]
    tags: ['v*-lulutls*']
  pull_request:
    branches: [lulutls]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lulutls-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, suffix: linux-amd64 }
          - { goos: linux,  goarch: arm64, suffix: linux-arm64 }
          - { goos: windows, goarch: amd64, suffix: windows-amd64.exe }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="$(git describe --tags --always)"
          go build -tags with_gvisor -trimpath \
            -ldflags "-s -w \
              -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' \
              -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o "mihomo-${{ matrix.suffix }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-${{ matrix.suffix }}
          path: mihomo-${{ matrix.suffix }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
